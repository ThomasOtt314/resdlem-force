[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resdlem-force"
version = "1.0.0"
description = "Extract DLEM forcing data (URMA met + PRISM/URMA precip) for reservoir geometries from Google Earth Engine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Ott" }]
requires-python = ">=3.9"
dependencies = [
    "earthengine-api",
    "polars>=1.0",
    "shapely>=2.0",
    "pyproj",
    "numpy",
    "requests",
    "geopandas",
    "pandas",
    "matplotlib>=3.7",
    "contextily",
    "google-cloud-monitoring",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
